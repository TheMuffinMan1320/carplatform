services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: carplatform
      POSTGRES_USER: carplatform
      POSTGRES_PASSWORD: devpassword
    ports:
      - '5432:5432'
    volumes:
      - 'carplatform-pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carplatform']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carplatform-pgdata:

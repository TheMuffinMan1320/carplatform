name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (unit + Testcontainers integration)
        run: ./mvnw -B verify
        # Testcontainers pulls postgres:16-alpine via the Docker daemon that's preinstalled
        # on GitHub-hosted ubuntu-latest runners -- no services: block needed.

  docker-build:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: carplatform:${{ github.sha }}
        # Build-only: no registry push, since no registry credentials are configured for
        # this repository. Wire up a login step + `push: true` here once you have one.
